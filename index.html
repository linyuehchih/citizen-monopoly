<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="市民大富翁：花蓮市的合作式公民教育遊戲，和大家一起面對市政問題。">
<title>市民大富翁</title>
<style>
/* 背景顏色跟著回合走（由 applyTone 設定）；註冊成「顏色」型態才能平滑漸變，不支援的瀏覽器就直接換色 */
@property --bg1{syntax:'<color>';inherits:true;initial-value:#ffe9d6}
@property --bg2{syntax:'<color>';inherits:true;initial-value:#f6f4ee}
@property --muted{syntax:'<color>';inherits:true;initial-value:#6b7280}
:root{
  --bg:#f6f4ee; --panel:#ffffff; --text:#1f2933; --muted:#6b7280; --line:#e3dfd3;
  --accent:#c2410c; --good:#15803d; --bad:#b91c1c;
  --s:#d98e04; --t:#2b7de9; --e:#2e9e5b; --c:#b45cc9;
  --bg1:#ffe9d6; --bg2:#f6f4ee; --star:0;
  --shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 6px 14px rgba(120,90,50,.10), 0 1px 3px rgba(120,90,50,.14);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16181d; --panel:#1f232b; --text:#e8e6df; --muted:#9aa3af; --line:#343a46;
         --accent:#f59e63; --good:#4ade80; --bad:#f87171;
         --bg1:#2b2430; --bg2:#16181d;
         --shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 6px 14px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.4); }
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text);
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;line-height:1.5}
html{background:var(--bg);transition:--bg1 1.2s ease,--bg2 1.2s ease,--muted 1.2s ease}
body{background:transparent;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,var(--bg1),var(--bg2))}
/* 夜晚的星星（只在最後幾回合出現） */
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--star);transition:opacity 1.2s ease;
  background:
    radial-gradient(2px 2px at 8% 10%,#fff,transparent),radial-gradient(1.5px 1.5px at 22% 24%,#fff,transparent),
    radial-gradient(2px 2px at 36% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 52% 18%,#fff,transparent),
    radial-gradient(2px 2px at 66% 6%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 22%,#fff,transparent),
    radial-gradient(2px 2px at 90% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 14% 38%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 94% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 34%,#fff,transparent)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 75%,#fff);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:26px;margin:18px 0 4px}
h2{font-size:18px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.panel.hl{border-left:4px solid var(--accent)}
.season{background:var(--panel);border:1px solid var(--line);border-left:4px solid #8b5cf6;border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13px;line-height:1.45}
.season span{display:block;color:var(--muted)}

/* 小海豚（市民滿意度） */
.dtrack{position:relative;height:36px;margin:0 20px}
.dline{position:absolute;left:0;right:0;bottom:4px;height:8px;border-radius:6px;background:var(--line)}
.dline i{display:block;height:100%;border-radius:6px;background:var(--s);transition:width .4s}
.dline u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.55}
.dline em{position:absolute;top:-24px;transform:translateX(-25%);font-size:13px;font-style:normal}
.dolphin{position:absolute;bottom:6px;width:40px;height:26px;transform:translateX(-50%);transition:left .5s}
.dolphin svg{width:100%;height:100%;display:block}
.dtrack.jump .dolphin{animation:hop .7s ease-in-out 4}
@keyframes hop{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-12px)}}
.bigDolphin{width:96px;height:60px;margin:0 auto 4px}
.bigDolphin svg{width:100%;height:100%}
.stars{font-size:28px;letter-spacing:4px}
.stars .st{display:inline-block}

/* 動態紀錄、圖鑑 */
.feed{list-style:none;padding:0;margin:0}
.feed li{padding:7px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.55}
.feed li:first-child{border-top:0;padding-top:0}
.pickTag{margin-top:6px;font-weight:700;color:var(--accent);font-size:14px}
.book{list-style:none;padding:0;margin:0;font-size:14px}
.book li{padding:3px 0}
.book li.locked{color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:11px 20px;font-weight:700;font-size:16px;min-height:44px;
  box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000),0 8px 14px rgba(120,60,20,.18);
  transition:transform .12s ease,box-shadow .12s ease}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn:active:not(:disabled){transform:translateY(3px) scale(.98);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost:active:not(:disabled){box-shadow:none}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg button{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:12px;min-height:44px;transition:transform .12s ease}
.seg button:active{transform:scale(.97)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rules{margin:0;padding-left:20px;color:var(--text)}
.rules li{margin:4px 0}
.foot{color:var(--muted);font-size:12px;margin-top:14px}

/* 頂部資訊 */
.hud{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px;font-weight:700}
.budget{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.players{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
.pl{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 4px;background:var(--panel)}
.pl.now{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.token{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);
  font-size:9px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.inds{display:grid;gap:5px;margin-bottom:10px}
.ind{display:grid;grid-template-columns:104px 1fr 62px;gap:8px;align-items:center;font-size:13px}
.bar{position:relative;height:12px;border-radius:6px;background:var(--line)}
.bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.55}
.ind b{text-align:right;font-variant-numeric:tabular-nums}
.delta{font-size:11px;margin-left:3px}
.delta.pos{color:var(--good)} .delta.neg{color:var(--bad)}

/* 棋盤 */
/* 立體視角：棋盤往後傾 --tilt，格子上的裝飾反向轉回來「站起來」；切到平面時 --tilt 變 0 */
:root{--tilt:16deg; --ar:1/1.2}
@media (min-width:600px){ :root{--tilt:20deg; --ar:1/1.1} }
html.flat{--tilt:0deg}
.stage{perspective:1300px;perspective-origin:50% 35%;margin:4px 0 34px}
html.flat .stage{margin-bottom:22px}
.board{position:relative;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:4px;aspect-ratio:var(--ar);
  padding:8px;border-radius:26px;background:color-mix(in srgb,#8fcf8f 26%,var(--panel));
  box-shadow:0 10px 0 color-mix(in srgb,#5f9a63 50%,var(--line)),0 22px 28px rgba(60,80,40,.22);
  transform:rotateX(var(--tilt));transform-style:preserve-3d}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 4px;
  box-shadow:0 4px 0 color-mix(in srgb,var(--line) 70%,#8b7355);
  font-size:10.5px;line-height:1.2;display:flex;flex-direction:column;min-width:0;transform-style:preserve-3d}
.tile .top{position:absolute;left:4px;right:4px;top:3px;display:flex;justify-content:space-between;color:var(--muted);font-size:9px}
.tile .dz{flex:1 1 0;min-height:0;position:relative}
.tile .nm{word-break:break-all;overflow:hidden;position:relative}
.deco{position:absolute;left:50%;bottom:0;width:27px;height:27px;margin-left:-13.5px;overflow:visible;pointer-events:none;
  transform-origin:50% 100%;transform:rotateX(calc(var(--tilt) * -1))}
.deco{filter:drop-shadow(0 0 .7px rgba(90,70,40,.6))}
@media (min-width:600px){ .deco{width:40px;height:40px;margin-left:-20px} }
/* 棋盤上的小人：一整層放在棋盤上，不隨整頁重畫而重建；位置與跳躍由程式逐格計算 */
.pl3d{position:absolute;inset:0;transform-style:preserve-3d;transform:translateZ(2px);pointer-events:none}
.pc{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.pc .sh{position:absolute;left:-9px;top:-3px;width:18px;height:6px;border-radius:50%;background:rgba(40,30,10,.28)}
.pc .bd{position:absolute;left:-11px;bottom:0;width:22px;height:31px;transform-origin:50% 100%;
  filter:drop-shadow(0 0 .7px rgba(60,40,20,.75))}
.pc.me .bd{filter:drop-shadow(0 0 .7px rgba(60,40,20,.75)) drop-shadow(0 0 4px color-mix(in srgb,var(--accent) 80%,#fff))}
@media (min-width:600px){
  .pc .sh{left:-12px;top:-4px;width:24px;height:8px}
  .pc .bd{left:-14px;width:28px;height:40px}
}
.center .deco{width:34px;height:34px;margin:0;left:auto;bottom:auto}
.center .deco.c1{left:6px;top:4px}.center .deco.c2{right:6px;top:4px}
.center .deco.c3{left:6px;bottom:4px}.center .deco.c4{right:6px;bottom:4px}
.tile.event{border-top:3px solid var(--accent)}
.tile.chance{border-top:3px solid #8b5cf6}
.tile.landmark{border-top:3px solid var(--good)}
.tile.rest{border-top:3px solid #94a3b8}
.tile.here{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.tokens{display:flex;gap:2px;flex-wrap:wrap;min-height:14px;position:relative}
.center{position:relative;transform-style:preserve-3d;
  grid-row:2/span 4;grid-column:2/span 4;background:var(--panel);border:1px dashed var(--line);border-radius:18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;text-align:center}
.who{display:flex;align-items:center;gap:6px;font-weight:700}
.dice{font-size:56px;line-height:1;display:inline-block}
.hint{color:var(--muted);font-size:13px;min-height:20px}

/* 彈出視窗 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
.sheet{background:var(--panel);color:var(--text);border-radius:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:18px;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 10px;background:var(--line);color:var(--muted);margin-right:6px}
.tag.hl{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.src{font-size:12px;color:var(--muted);margin:2px 0 8px}
.scene{margin:8px 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin-bottom:8px;min-height:44px;
  box-shadow:0 2px 0 var(--line);transition:transform .12s ease,box-shadow .12s ease,border-color .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:active:not(:disabled){transform:scale(.98);box-shadow:none}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt.pick:disabled{opacity:1}
.opt.pick{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.opt .lb{font-weight:700;margin-bottom:4px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-variant-numeric:tabular-nums}
.chip.pos{color:var(--good);border-color:currentColor}
.chip.neg{color:var(--bad);border-color:currentColor}
.res{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--bg)}
.log{font-size:13px;color:var(--muted);padding-left:18px;margin:6px 0}
.big{font-size:32px;margin:0}
.win{color:var(--good)} .lose{color:var(--bad)}

/* 連線：大廳、建議、輸入框 */
input[type=text]{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0;flex:1;min-height:44px}
.sug{margin-top:6px;font-size:13px;color:var(--accent)}
.roomcode{font-size:40px;font-weight:800;letter-spacing:8px;text-align:center;margin:4px 0 2px}
.seatrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.seatrow:first-child{border-top:0}
.seatrow .nm2{flex:1;min-width:0}
.err{color:var(--bad);font-size:13px;margin-top:6px}
.badge{display:inline-block;font-size:11px;border-radius:999px;padding:0 8px;background:var(--line);color:var(--muted);margin-left:4px}

/* 滑鼠才有的輕微浮起（手機觸控不套用，避免點完卡在浮起狀態） */
@media (hover:hover){
  .btn:hover:not(:disabled){transform:translateY(-1px)}
  .opt:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 0 var(--line)}
}

/* 進場動畫：只在 data-a 存在時播（JS 依「第一次出現的時間」決定，重畫畫面不會重播） */
@keyframes dicepop{
  0%{transform:rotate(var(--rot,-25deg)) translateY(-14px) scale(1.25)}
  60%{transform:rotate(calc(var(--rot,-25deg) * -.25)) translateY(2px) scale(.94)}
  100%{transform:none}
}
@keyframes fadein{from{opacity:0}}
@keyframes sheetin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes optin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg);opacity:0}70%{transform:scale(1.25) rotate(8deg);opacity:1}100%{transform:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dice[data-a]{animation:dicepop .35s cubic-bezier(.3,1.4,.5,1) backwards}
.overlay[data-a]{animation:fadein .2s ease-out backwards}
.sheet[data-a]{animation:sheetin .26s cubic-bezier(.2,.9,.3,1) backwards}
.opt[data-a]{animation:optin .3s ease-out backwards}
.st[data-a]{animation:starpop .4s cubic-bezier(.3,1.6,.5,1) backwards}
.fadeup[data-a]{animation:fadeup .4s ease-out backwards}

/* 系統設定「減少動態效果」：全部直接顯示，不跳、不漸變 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<!-- 棋盤格子的手繪裝飾（黏土風：圓角、單色加一層暗面、一點高光）。畫在 40x40 的框裡，底邊在 y=38 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="d-tree" viewBox="0 0 40 40">
    <ellipse cx="20" cy="37.5" rx="12" ry="2.5" fill="rgba(0,0,0,.14)"/>
    <rect x="18" y="26" width="4" height="11" rx="1.5" fill="#8a5a3a"/>

    <circle cx="20" cy="17" r="11" fill="#52b36e"/><circle cx="16" cy="13" r="3.2" fill="#86d79a"/>

    <rect x="27" y="29" width="3" height="8" rx="1.5" fill="#8a5a3a"/><circle cx="28.5" cy="24" r="6.5" fill="#3fa05f"/>
    <path d="M14 38 Q20 33 26 38 Z" fill="#e9d6b0"/>
  </symbol>
  <symbol id="d-park" viewBox="0 0 40 40">
    <ellipse cx="20" cy="37.5" rx="17" ry="2.5" fill="rgba(0,0,0,.14)"/>
    <rect x="9" y="25" width="4" height="12" rx="1.5" fill="#8a5a3a"/><circle cx="11" cy="18" r="9" fill="#52b36e"/><circle cx="8" cy="14" r="3" fill="#86d79a"/>
    <rect x="21" y="29" width="15" height="3.5" rx="1.5" fill="#c99a6b"/><rect x="22" y="32" width="2.5" height="5" fill="#9c6b45"/><rect x="32.5" y="32" width="2.5" height="5" fill="#9c6b45"/>
    <circle cx="24" cy="25" r="2.4" fill="#f28aa5"/><circle cx="30" cy="26" r="2.4" fill="#f4b942"/>
  </symbol>
  <symbol id="d-seaside" viewBox="0 0 40 40">
    <rect x="19" y="14" width="2.4" height="23" rx="1" fill="#9c6b45"/>
    <path d="M5 19 Q20 1 35 19 Z" fill="#e0584f"/><path d="M13 19 Q20 7 27 19 Z" fill="#fff1d6"/>
    <path d="M2 36 q4.5 -4 9 0 t9 0 t9 0 t9 0" fill="none" stroke="#5aa0dc" stroke-width="3.2" stroke-linecap="round"/>
  </symbol>
  <symbol id="d-river" viewBox="0 0 40 40">
    <path d="M3 24 q4.5 -4 9 0 t9 0 t9 0 t9 0" fill="none" stroke="#8cc4ee" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M3 31 q4.5 -4 9 0 t9 0 t9 0 t9 0" fill="none" stroke="#5aa0dc" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M3 37 q4.5 -4 9 0 t9 0 t9 0 t9 0" fill="none" stroke="#3b7fbd" stroke-width="3.2" stroke-linecap="round"/>
    <rect x="29" y="9" width="3" height="12" rx="1.2" fill="#8a5a3a"/><circle cx="30.5" cy="7" r="6" fill="#52b36e"/><circle cx="28.5" cy="5" r="2" fill="#86d79a"/>
  </symbol>
  <symbol id="d-station" viewBox="0 0 40 40">
    <ellipse cx="20" cy="37.5" rx="17" ry="2.5" fill="rgba(0,0,0,.14)"/>
    <rect x="5" y="17" width="30" height="20" rx="2" fill="#fff1d6"/><rect x="5" y="31" width="30" height="6" rx="2" fill="#ecd5a6"/>
    <path d="M2 18 L20 6 L38 18 Z" fill="#e0584f"/><path d="M8 17 L20 9 L32 17 Z" fill="#f1857b"/>
    <circle cx="20" cy="15" r="3.6" fill="#fff" stroke="#9c6b45" stroke-width="1.2"/><path d="M20 13 V15.2 H21.6" fill="none" stroke="#9c6b45" stroke-width="1"/>
    <rect x="16" y="25" width="8" height="12" rx="2" fill="#5aa0dc"/><rect x="8" y="23" width="5.5" height="6" rx="1" fill="#9ccaf0"/><rect x="26.5" y="23" width="5.5" height="6" rx="1" fill="#9ccaf0"/>
  </symbol>
  <symbol id="d-busstop" viewBox="0 0 40 40">
    <ellipse cx="20" cy="37.5" rx="14" ry="2.5" fill="rgba(0,0,0,.14)"/>
    <rect x="18.5" y="12" width="3" height="25" rx="1.2" fill="#9aa0ab"/>
    <circle cx="20" cy="9" r="8" fill="#5aa0dc"/><rect x="14.5" y="5" width="11" height="8" rx="2" fill="#fff"/>
    <rect x="14.5" y="8" width="11" height="2" fill="#5aa0dc"/><circle cx="17.5" cy="13.2" r="1.3" fill="#3b7fbd"/><circle cx="22.5" cy="13.2" r="1.3" fill="#3b7fbd"/>

<script>
(function(){
  var app = document.getElementById('app');
  var D = window.GAME_DATA;
  if(!D){
    app.innerHTML = '<div class="panel"><h2>找不到遊戲資料</h2><p>請先執行 tools/render_cards.py，產生 data/game-data.js 後再重新開啟這個網頁。</p></div>';
    return;
  }
  var C = D.config;
  var IND = [
    {k:'s', icon:'🙂', name:'市民滿意度'},
    {k:'t', icon:'🚗', name:'交通順暢'},
    {k:'e', icon:'🌿', name:'環境整潔'},
    {k:'c', icon:'🤝', name:'照顧與安全'}
  ];
  var TOKEN_COLORS = ['#dc2626','#2563eb','#16a34a','#ca8a04'];
  var TYPE_ICON = {event:'📋', chance:'🎁', landmark:'📍', rest:'☕'};
  var DICE = ['🎲','⚀','⚁','⚂','⚃','⚄','⚅'];

  // 每一格的裝飾（對應 <symbol id="d-名稱">）
  var DECO = {1:'station',2:'shops',3:'nightmarket',4:'creative',5:'oldhouse',6:'mansion',7:'shops',8:'river',9:'market',10:'cityhall',
              11:'shops',12:'park',13:'seaside',14:'nightmarket',15:'hospital',16:'community',17:'apartment',18:'school',19:'trail',20:'busstop'};

  /* ---------- 棋盤視角：立體（預設）或平面，記在這個瀏覽器 ---------- */
  var VIEW_FLAT = false;
  try{ VIEW_FLAT = localStorage.getItem('cityViewFlat') === '1'; }catch(e){}
  document.documentElement.classList.toggle('flat', VIEW_FLAT);
  function setView(flat){
    VIEW_FLAT = flat;
    document.documentElement.classList.toggle('flat', flat);
    try{ localStorage.setItem('cityViewFlat', flat ? '1' : '0'); }catch(e){}
    if(G && !G.over) render();
  }

  /* ---------- 棋盤上的小人 ----------
     整個畫面會一直重畫，所以小人放在自己的一層（PC.layer），每次重畫後再接回新的棋盤；
     走路動畫由 requestAnimationFrame 依時間逐格計算，不靠 CSS，所以不會被重畫打斷 */
  var PC = {game:null, layer:null, items:[], board:null, raf:0};
  var reduceMq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;

  function personSvg(i){
    return '<svg viewBox="0 0 24 34" width="100%" height="100%" aria-hidden="true">'+
      '<rect x="7" y="25" width="4" height="7" rx="2" fill="#5b4a3a"/><rect x="13" y="25" width="4" height="7" rx="2" fill="#5b4a3a"/>'+
      '<rect x="4" y="14" width="16" height="14" rx="6" fill="'+TOKEN_COLORS[i]+'"/><rect x="4" y="23" width="16" height="5" rx="2.5" fill="rgba(0,0,0,.18)"/>'+
      '<circle cx="3.5" cy="21" r="2.6" fill="#ffd9b5"/><circle cx="20.5" cy="21" r="2.6" fill="#ffd9b5"/>'+
      '<circle cx="12" cy="9" r="7.5" fill="#ffd9b5"/>'+
      '<path d="M4.5 8.5 Q5 1 12 1.2 Q19 1 19.5 8.5 Q15 4.5 12 5.5 Q9 4.5 4.5 8.5 Z" fill="#5b3a29"/>'+
      '<circle cx="9.3" cy="10" r="1" fill="#3b2a20"/><circle cx="14.7" cy="10" r="1" fill="#3b2a20"/>'+
      '<path d="M10 12.6 Q12 14.2 14 12.6" fill="none" stroke="#c0614a" stroke-width="1" stroke-linecap="round"/>'+
      '<text x="12" y="24.2" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">'+(i+1)+'</text></svg>';
  }
  // 小人站的位置：該格「裝飾區」的下緣中央；每位玩家左右錯開一點，同一格也看得到每個人
  function pieceSpot(i, idx){
    var t = PC.board && PC.board.querySelector('.tile[data-id="'+(idx+1)+'"]');
    if(!t) return null;
    var dz = t.querySelector('.dz'), n = G.players.length, gap = innerWidth >= 600 ? 11 : 8;
    return {x: t.offsetLeft + t.offsetWidth/2 + (i - (n-1)/2) * gap,
            y: t.offsetTop + (dz ? dz.offsetTop + dz.offsetHeight : t.offsetHeight*0.5) + 5};
  }
  function placePiece(it, x, y, lift, sy){
    it.el.style.transform = 'translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0)';
    it.sh.style.transform = 'scale('+(1 - Math.min(.45, lift/45)).toFixed(2)+')';
    it.bd.style.transform = 'rotateX(calc(var(--tilt) * -1)) translateY('+(-lift).toFixed(1)+'px) scale(1,'+sy.toFixed(3)+')';
  }
  function detachPieces(){
    if(PC.layer && PC.layer.parentNode) PC.layer.parentNode.removeChild(PC.layer);
    PC.game = null; PC.layer = null; PC.items = []; PC.board = null;
  }
  function syncPieces(board){
    if(!board || !G) return;
    var fresh = PC.game !== G;
    if(fresh){
      detachPieces();
      PC.layer = document.createElement('div'); PC.layer.className = 'pl3d';
      PC.items = G.players.map(function(p, i){
        var el = document.createElement('div'); el.className = 'pc';
        el.innerHTML = '<div class="sh"></div><div class="bd">'+personSvg(i)+'</div>';
        PC.layer.appendChild(el);
        return {i:i, el:el, sh:el.firstChild, bd:el.lastChild, at:p.pos, dest:p.pos, queue:[], hop:null, sq:0, x:0, y:0, ready:false};
      });
      PC.game = G;
    }
    PC.board = board;
    board.appendChild(PC.layer);
    var reduce = !!(reduceMq && reduceMq.matches), tileCount = D.tiles.length;
    PC.items.forEach(function(it){
      var target = G.players[it.i].pos;
      it.el.classList.toggle('me', it.i === G.turn);
      if(it.ready && target !== it.dest){
        var steps = (target - it.dest + tileCount) % tileCount;
        if(reduce || steps > 12 || it.queue.length > 8){ it.queue = []; it.hop = null; it.at = target; it.ready = false; }
        else for(var s = 1; s <= steps; s++) it.queue.push((it.dest + s) % tileCount);
      }
      it.dest = target;
      if(!it.ready || (!it.hop && !it.queue.length)){        // 靜止：直接放在所在格（棋盤重畫後版面可能微調）
        var sp = pieceSpot(it.i, it.hop ? it.at : target);
        if(sp){ it.x = sp.x; it.y = sp.y; placePiece(it, sp.x, sp.y, 0, 1); it.at = target; it.ready = true; }
      } else if(it.hop){                                      // 正在跳：先擺到目前位置，等下一格動畫接手
        placePiece(it, it.x, it.y, 0, 1);
      }
    });
    if(PC.items.some(function(it){ return it.hop || it.queue.length; })) startPieceLoop();
  }
  function startPieceLoop(){ if(!PC.raf) PC.raf = requestAnimationFrame(pieceTick); }
  function startHop(it, now){
    var idx = it.queue.shift(), to = pieceSpot(it.i, idx);
    if(!to){ it.at = idx; return; }
    it.hop = {fx:it.x, fy:it.y, to:to, idx:idx, t0:now, dur: it.queue.length >= 2 ? 110 : 160};
  }
  function pieceTick(now){
    PC.raf = 0;
    var busy = false;
    PC.items.forEach(function(it){
      if(!it.hop && it.queue.length) startHop(it, now);
      if(it.hop){
        var h = it.hop, t = (now - h.t0) / h.dur;
        if(t >= 1){
          it.x = h.to.x; it.y = h.to.y; it.at = h.idx; it.hop = null; it.sq = now;
          placePiece(it, it.x, it.y, 0, 1);
          busy = true;                                        // 還有下一格或要壓扁，繼續下一個畫面
        } else {
          var e = t < 0 ? 0 : t;
          placePiece(it, h.fx + (h.to.x - h.fx) * e, h.fy + (h.to.y - h.fy) * e,
                     4 * e * (1 - e) * (innerWidth >= 600 ? 20 : 15), 1);
          busy = true;
        }
      } else if(it.sq && now - it.sq < 140){                  // 落地壓扁一下
        placePiece(it, it.x, it.y, 0, 1 - 0.22 * Math.sin(Math.PI * (now - it.sq) / 140));
        busy = true;
      } else if(it.sq){ it.sq = 0; placePiece(it, it.x, it.y, 0, 1); }
    });
    if(busy) PC.raf = requestAnimationFrame(pieceTick);
  }

  /* ---------- 進場動畫：整個畫面會一直重畫，所以用「這個東西第一次出現的時間」決定播到哪裡 ---------- */
  var SEEN_AT = {};
  function animAttr(key, dur, extra, style){
    var t = Date.now();
    if(SEEN_AT[key] == null) SEEN_AT[key] = t;
    var delay = (extra || 0) - (t - SEEN_AT[key]);        // 還沒開始＞0；播到一半＜0；播完就不再加動畫
    if(delay <= -dur) return style ? ' style="'+style+'"' : '';
    return ' data-a style="'+(style ? style+';' : '')+'animation-delay:'+Math.round(delay)+'ms"';
  }

  /* ---------- 背景顏色隨回合走完「一天」：清晨→白天→午後→黃昏→夜晚 ---------- */
  var TONE = {
    at:   [0, 3/11, 6/11, 9/11, 1],
    light:{ bg1:['#ffe9d6','#eaf4fb','#f4f0e4','#ffd9c2','#c9cfe8'],
            bg2:['#f6f4ee','#f6f4ee','#f6f4ee','#f3e3dd','#e4e0ee'],
            muted:['#6b7280','#6b7280','#6b7280','#5f6672','#4b5563'],
            star:[0,0,0,0.1,0.9] },
    dark: { bg1:['#2b2430','#182330','#2a2620','#33221f','#1d2040'],
            bg2:['#16181d','#16181d','#16181d','#1b1618','#12131c'],
            star:[0,0,0,0.15,0.85] }
  };
  function hexRgb(h){ return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)]; }
  function toneAt(arr, f, isColor){
    var at = TONE.at, i = 0;
    while(i < at.length-2 && f > at[i+1]) i++;
    var t = Math.max(0, Math.min(1, (f-at[i])/(at[i+1]-at[i])));
    if(!isColor) return arr[i] + (arr[i+1]-arr[i])*t;
    var a = hexRgb(arr[i]), b = hexRgb(arr[i+1]);
    return 'rgb('+[0,1,2].map(function(k){ return Math.round(a[k]+(b[k]-a[k])*t); }).join(',')+')';
  }
  var darkMq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var toneRound = 1;
  function applyTone(round){
    toneRound = round;
    var f = C.rounds > 1 ? Math.max(0, Math.min(1, (round-1)/(C.rounds-1))) : 0;
    var dark = !!(darkMq && darkMq.matches), P = dark ? TONE.dark : TONE.light;
    var st = document.documentElement.style;
    try{
      st.setProperty('--bg1', toneAt(P.bg1, f, true));
      st.setProperty('--bg2', toneAt(P.bg2, f, true));
      st.setProperty('--star', toneAt(P.star, f, false).toFixed(2));
      if(dark) st.removeProperty('--muted'); else st.setProperty('--muted', toneAt(P.muted, f, true));
    }catch(e){}
  }
  if(darkMq && darkMq.addEventListener) darkMq.addEventListener('change', function(){ applyTone(toneRound); });
  var FALLBACK = {label:'先擱置，這次沒預算處理', cost:0, fx:{s:-3}, result:'預算不夠，問題只能先放著，市民有點失望。'};
  var REFLECT = {
    s:'市民滿意度是大家最在意的。如果只能選一件事讓市民更有感，你會選什麼？為什麼？',
    t:'交通影響每個人的日常。你覺得該先處理塞車、停車，還是公共運輸？誰的需要應該排前面？',

  var STAR2 = {s:75, o:25}, STAR3 = {s:80, o:30};
  function rate(win){
    var v = G.ind, minO = Math.min(v.t, v.e, v.c), stars = 0;
    if(win){
      stars = 1;
      if(v.s >= STAR2.s && minO >= STAR2.o) stars = 2;
      if(v.s >= STAR3.s && minO >= STAR3.o) stars = 3;

    var v = G.ind, all = [v.s, v.t, v.e, v.c];
    if(Math.max.apply(null, all) - Math.min.apply(null, all) <= 12){
      return {name:'平衡大師', text:'四項指標都顧到了，沒有哪一塊被犧牲。'};

    var top = 't';

        t:{name:'交通疏導員', text:'你把城市的路理順了。'},
        e:{name:'環境守護者', text:'你讓花蓮市更乾淨、更宜居。'},

  /* ---------- 開局 ---------- */
  function newGame(players){
    G = {
      players: players, turn:0, round:1, budget:C.startBudget,
      ind:{s:C.startIndicator, t:C.startIndicator, e:C.startIndicator, c:C.startIndicator},
      usedEvents:{}, usedChances:{}, log:[], dice:0, phase:'idle', msg:'',
      delta:{}, deltaBudget:0, over:false, result:null, rollResolve:null, level:SETUP.level,
      seasonDeck:[], season:null,
      botWait:SETUP.botWait, lastReason:'', feed:[], mile:{}, jumpUntil:0, newCards:[], newSeasons:[],
      prompt:null, promptRes:null, promptTimer:null
    };
    nextSeason();                                    // 第 1 回合的時節
    if(window.CityStats) window.CityStats.load();   // 先把大家的選擇比例抓回來
  }

  function startGame(){
    var botNo = 0;
    var players = [];
    for(var i=0;i<SETUP.n;i++){
      var bot = SETUP.seats[i]==='bot';
      players.push({name: bot ? '電腦'+String.fromCharCode(65+botNo++) : '玩家'+(i+1), bot:bot, remote:false, pos:0});
    }
    newGame(players);
    gameLoop(0);
  }

  /* ---------- 主迴圈 ---------- */
  async function gameLoop(startTurn){
    render();
    var first = startTurn || 0;
    while(!G.over){
      for(G.turn=first; G.turn<G.players.length && !G.over; G.turn++){
        await playTurn();
      }
      first = 0;
      if(G.over) break;
      G.turn = 0;
      await endRound();
    }
  }

  function cur(){ return G.players[G.turn]; }

  async function playTurn(){
    var p = cur(), pi = G.turn;
    if(isHost()) saveGame();                      // 房主重新整理後，可以從這個回合接回來
    G.phase = 'roll'; G.dice = 0;
    G.msg = p.bot ? p.name+' 準備擲骰子…' : (NET.on ? p.name+' 正在擲骰子…' : '輪到你了，擲骰子吧！');
    render();
    if(p.bot){ await sleep(900); }
    else if(p.remote){ await waitRemote(pi, 'roll'); }   // 朋友按擲骰子；太久沒動作就由電腦代擲
    else { await new Promise(function(r){ G.rollResolve = r; }); }
    G.phase = 'moving';
    for(var k=0;k<8;k++){ G.dice = 1+rnd(6); render(); await sleep(70); }
    var steps = 1+rnd(6);
    G.dice = steps; render(); await sleep(350);
    for(var s=0;s<steps;s++){
      p.pos = (p.pos+1) % D.tiles.length;
      render(); await sleep(170);
    }
    var tile = D.tiles[p.pos];
    G.msg = p.name+' 走到了「'+tile.name+'」';
    G.phase = 'resolve'; render();
    await sleep(250);
    await resolveTile(p, tile);
    G.phase = 'idle'; render();
  }

  async function resolveTile(p, tile){
    if(tile.type==='event') return playEvent(p, tile);
    if(tile.type==='chance') return playChance(p, tile);
    if(tile.type==='landmark'){
      var ic = IND.filter(function(i){ return i.k===tile.bonus; })[0];
      var fx = {}; fx[tile.bonus] = C.tileBonus;
      applyEffects(fx, 0);
      render();
      if(checkLose()) return;
      addFeed(piOf(p), '<b>'+esc(p.name)+'</b>・'+esc(tile.name)+'：📍 運作順利 <span class="chips" style="display:inline-flex">'+fxChips(fx)+'</span>');
      return info(p, '📍 '+tile.name, tile.name+'運作順利，'+ic.name+'提升了。', 0, fx);
    }
    if(tile.type==='rest'){
      applyEffects({}, C.restBudget);
      render();
      addFeed(piOf(p), '<b>'+esc(p.name)+'</b>・'+esc(tile.name)+'：☕ 休息一下 <span class="chips" style="display:inline-flex">'+costChip(-C.restBudget)+'</span>');
      return info(p, '☕ '+tile.name, '稍微休息一下，整理好預算。', C.restBudget, {});
    }
  }

  /* ---------- 事件卡 ---------- */
  function draw(pool, used, tileId){
    var cands = pool.filter(function(e){ return !used[e.id] && (!e.tiles || e.tiles.indexOf(tileId)>=0); });
    if(!cands.length) cands = pool.filter(function(e){ return !used[e.id]; });
    if(!cands.length){
      Object.keys(used).forEach(function(k){ delete used[k]; });
      cands = pool.filter(function(e){ return !e.tiles || e.tiles.indexOf(tileId)>=0; });
      if(!cands.length) cands = pool;
    }
    var c = pick(cands);
    used[c.id] = true;
    return c;
  }

  // 電腦玩家的選擇邏輯在 bot.js，這裡只負責把目前的城市狀態交給它
  function incomeNow(){
    var n = G.players.length;
    return C.incomeByPlayers && C.incomeByPlayers[n] != null ? C.incomeByPlayers[n] : C.incomePerPlayerPerRound * n;
  }
  function decayNow(){
    var n = G.players.length;
    return C.decayByPlayers && C.decayByPlayers[n] != null ? C.decayByPlayers[n] : Math.round(C.decayPerPlayerPerRound * n);
  }
  // 時節：每回合抽一張，決定「這回合結束時」各項指標各掉多少（基本下滑量 × 該時節的倍率）。
  // 8 張時節的平均倍率都是 1，所以整體難度不變，只是每回合掉的重點不一樣。
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j = rnd(i+1), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function nextSeason(){
    if(!D.seasons || !D.seasons.length){ G.season = null; return; }
    if(!G.seasonDeck.length) G.seasonDeck = shuffle(D.seasons.slice());
    G.season = G.seasonDeck.pop();
    markSeen('seasonsSeen', G.season.id);
  }
  function decayVec(){
    var base = decayNow(), v = {};
    IND.forEach(function(i){
      var m = G.season && G.season.mult[i.k] != null ? G.season.mult[i.k] : 1;
      v[i.k] = Math.max(0, Math.round(base * m));
    });
    return v;
  }
  function botChoose(opts){
    return window.CityBot.choose(opts, {
      ind: G.ind, budget: G.budget, round: G.round, rounds: C.rounds,
      n: G.players.length, dec: decayNow(), decVec: decayVec(), income: incomeNow(), cfg: C
    }, G.level);
  }

  async function playEvent(p, tile){
    var card = draw(D.events, G.usedEvents, tile.id);
    markSeen('seen', card.id);
    var opts = card.options.slice();
    if(!opts.some(function(o){ return o.cost <= G.budget; })) opts.push(FALLBACK);
    var pi = piOf(p);
    var idx = await chooseOption(card, opts, p, tile, pi);
    var o = opts[idx];
    applyEffects(o.fx, -o.cost);
    addFeed(piOf(p), '<b>'+esc(p.name)+'</b>・'+esc(tile.name)+'：'+esc(card.title)+'<br>選了「'+esc(o.label)+'」'+(G.autoPlayed ? '（電腦代打）' : '')+' '+
      '<span class="chips" style="display:inline-flex">'+costChip(o.cost)+fxChips(o.fx)+'</span>');
    G.log.push({round:G.round, who:p.name, bot:p.bot, auto:!!G.autoPlayed, seat:pi, tile:tile.name, title:card.title, choice:o.label, cost:o.cost,
                cardId:card.id, idx:idx, real: idx < card.options.length});
    // 匿名統計：這台裝置的真人自己選的才記；朋友的選擇由朋友自己的裝置記
    if(!p.bot && !p.remote && !G.autoPlayed && idx < card.options.length && window.CityGame && typeof window.CityGame.onChoice==='function'){
      try{ window.CityGame.onChoice({cardId:card.id, optionIndex: idx, round:G.round}); }catch(e){}
    }
    render();
    await showResult(card, o, p, idx, pi);
    checkLose();
  }

  // 「X% 的玩家和你選一樣」。紀錄不夠、沒設定網址、或不是自己選的，就什麼都不顯示
  function shareLine(cardId, idx){
    var card = cardById(cardId);
    if(!window.CityStats || !card || idx >= card.options.length) return '';
    var s = window.CityStats.share(card.id, idx);
    if(!s) return '';
    return '<div class="res" style="margin-top:8px">📊 在所有玩家裡，<b>'+s.pct+'%</b> 的人跟你選一樣（共 '+s.total+' 人選過這張卡）'+
      '<div class="hint">這是玩家選擇統計，不是民意調查。</div></div>';
  }

  function cardHead(card, tile){
    return '<div><span class="tag '+(card.kind==='hualien'?'hl':'')+'">'+(card.kind==='hualien'?'花蓮在地':'市政情境')+'</span>'+
      '<span class="tag">📍 '+esc(tile.name)+'</span></div>'+
      '<h2 style="margin-top:8px">'+esc(card.title)+'</h2>';
  }

  /* ---------- 提示視窗系統（事件卡、結果、回合結束）----------
     所有彈出視窗都用一份「提示」資料（G.prompt）描述：單機、房主、朋友的畫面都靠同一份資料畫出一樣的視窗。
     房主把提示發布到雲端，朋友的手機就會顯示一樣的視窗；輪到誰，誰就能操作，其他人只能看（和給建議）。 */
  var PROMPT_SEQ = 0;

  // 這台裝置能不能「選」這個提示（事件卡）
  function canAct(P){
    if(P.seat == null || P.seat < 0) return !NET.on || isHost();
    if(NET.on) return P.seat === NET.me;
    var pl = G.players[P.seat];
    return !!pl && !pl.bot;
  }
  // 這台裝置能不能按「繼續」：單機都可以；房主可以跳過任何人的；朋友只能按自己的
  function canAck(P){
    if(!NET.on) return true;
    if(isHost()) return true;
    return P.seat === NET.me;
  }

  // 顯示一個提示，等結果（選了哪個、或按了繼續、或時間到）。auto 是自動繼續的毫秒數，0 代表一定要有人按
  function askPrompt(P, auto){
    P.id = ++PROMPT_SEQ; P.rev = 0;
    G.prompt = P;
    return new Promise(function(resolve){
      var done = false;
      G.promptRes = function(v){
        if(done) return;
        done = true; clearTimeout(G.promptTimer); G.promptRes = null;
        resolve(v);
      };
      showPromptModal(); netPublish();
      if(auto) G.promptTimer = setTimeout(function(){ if(G.promptRes) G.promptRes('auto'); }, auto);
    });
  }
  function updatePrompt(patch){
    if(!G.prompt) return;
    for(var k in patch) G.prompt[k] = patch[k];
    G.prompt.rev++;
    showPromptModal(); netPublish();
  }
  function endPrompt(){ G.prompt = null; closeModal(); NET.shownKey = ''; netPublish(); }

  // 朋友對選項的「建議」標籤
  function suggestTags(P, i){
    if(!P.suggest) return '';
    var names = [];
    Object.keys(P.suggest).forEach(function(seat){
      if(P.suggest[seat] === i && G.players[seat]) names.push(G.players[seat].name);
    });
    return names.length ? '<div class="sug">💡 '+esc(names.join('、'))+' 建議</div>' : '';
  }

  function ackHtml(P, label){
    return canAck(P) ? '<button class="btn" id="goOn">'+label+'</button>'
                     : '<div class="hint">'+(NET.on ? '幾秒後自動繼續…' : '')+'</div>';
  }

  function promptHtml(P){
    var actor = P.seat >= 0 ? G.players[P.seat] : null;
    var me = canAct(P);
    if(P.kind === 'card'){
      var card = cardById(P.cardId), tile = tileById(P.tileId);
      var status = P.picked != null ? '' :
        (me ? '請 '+actor.name+' 選一個處理方式' : actor.name+' 正在選擇…'+(NET.on ? '（你可以點選項給建議）' : ''));
      return cardHead(card, tile)+'<p class="scene">'+esc(card.scene)+'</p>'+
        '<div class="hint" style="margin-bottom:8px">💰 目前預算 '+P.budget+'　'+status+'</div>'+
        '<div class="hint" style="margin-bottom:8px;color:var(--accent)">'+(P.note ? esc(P.note) : '&nbsp;')+'</div>'+
        P.opts.map(function(o,i){
          var afford = o.cost <= P.budget;
          var dis = !afford || P.picked != null || (!me && !NET.on);
          return '<button class="opt'+(P.picked===i?' pick':'')+'" data-i="'+i+'"'+(dis?' disabled':'')+animAttr('opt|'+P.id+'|'+i, 300, 120+60*i)+'>'+
            '<div class="lb">'+String.fromCharCode(65+i)+'. '+esc(o.label)+'</div>'+
            '<div class="chips">'+costChip(o.cost)+fxChips(o.fx)+'</div>'+
            (afford ? '' : '<div class="hint">預算不夠</div>')+
            (P.picked===i ? '<div class="pickTag">✅ '+esc(actor.name)+' 選了這個</div>' : '')+
            suggestTags(P, i)+'</button>';
        }).join('')+
        '<div style="text-align:right;margin-top:4px"><button class="btn ghost" id="exitInPrompt">🚪 離開遊戲</button></div>';
    }
    if(P.kind === 'result'){
      return '<h2>'+esc(P.title)+'</h2>'+
        '<div class="res"><b>'+esc(P.who)+'選了：'+esc(P.label)+'</b>'+
        (P.reason ? '<div class="hint" style="margin-top:4px;color:var(--accent)">💭 '+esc(P.reason)+'</div>' : '')+
        '<div style="margin-top:6px">'+esc(P.text)+'</div>'+
        '<div class="chips" style="margin-top:8px">'+costChip(P.cost)+fxChips(P.fx)+'</div></div>'+
        (me && P.real ? shareLine(P.cardId, P.idx) : '')+
        ackHtml(P, '繼續');
    }
    if(P.kind === 'info'){
      return '<h2>'+esc(P.title)+'</h2><p class="scene">'+esc(P.text)+'</p>'+
        '<div class="chips" style="margin-bottom:12px">'+(P.gain ? costChip(-P.gain) : '')+fxChips(P.fx || {})+'</div>'+
        ackHtml(P, '繼續');
    }
    var season = P.season;   // 回合結束
    return '<h2>第 '+P.round+' 回合結束</h2>'+
      (season ? '<div style="margin-bottom:8px">'+season.icon+' 這回合的時節：<b>'+esc(season.name)+'</b></div>' : '')+
      '<div class="res">稅收進帳 💰+'+P.inc+'。'+esc(season ? season.text : '城市會老化，人也會抱怨。')+'</div>'+
      '<div class="chips" style="margin-bottom:12px">'+costChip(-P.inc)+fxChips(P.fx)+'</div>'+
      ackHtml(P, P.last ? '看結果' : '下一回合');
  }

  function showPromptModal(){
    if(EXITING) return;                      // 正在問「要不要離開」，先不要被新的提示蓋掉
    var P = G.prompt;
    NET.shownKey = P ? P.id+':'+P.rev : '';
    if(!P){ closeModal(); return; }
    var ov = modal(promptHtml(P), 'sheet|'+P.id);
    ov.querySelectorAll('.opt').forEach(function(b){
      b.onclick = function(){
        if(b.disabled) return;
        var i = +b.dataset.i;
        if(canAct(P)) chooseNow(P, i); else if(NET.on) sendSuggest(i);
      };
    });
    var go = ov.querySelector('#goOn');
    if(go) go.onclick = function(){ ackNow(P); };
    var ex = ov.querySelector('#exitInPrompt');
    if(ex) ex.onclick = confirmExit;
  }

  /* ---------- 離開遊戲 ---------- */
  var EXITING = false;
  function confirmExit(){
    var host = isHost(), guest = isGuest();
    var msg = host ? '你是房主，這局是在你的瀏覽器上跑的。離開後整局會結束，朋友的畫面也會停止。' :
              guest ? '離開後，你的位子會由電腦代打（約 15 秒內換手），不影響其他人繼續玩。' :
              '離開後這局不會保留，會回到首頁。';
    EXITING = true;
    var ov = modal('<h2>要離開遊戲嗎？</h2><p class="scene">'+msg+'</p>'+
      '<div class="row" style="margin-top:12px"><button class="btn ghost" id="exitNo">繼續玩</button>'+
      '<button class="btn" id="exitYes">'+(host ? '結束並回首頁' : '離開遊戲')+'</button></div>');
    ov.querySelector('#exitNo').onclick = function(){
      EXITING = false; closeModal();
      if(G && G.prompt) showPromptModal();
    };
    ov.querySelector('#exitYes').onclick = function(){ this.disabled = true; exitGame(); };
  }
  async function exitGame(){
    if(NET.on){
      if(isHost()){                          // 房主：先通知大家「這局結束了」，再離開
        try{ await Promise.race([CityNet.setStatus(NET.code, 'closed'), sleep(1500)]); }catch(e){}
      }
      try{ CityNet.leave(); CityNet.clearSession(); }catch(e){}   // 清掉「記住房間」，重新整理才不會又被拉回來
    }
    location.href = baseUrl();
  }
  function renderClosed(){
    app.innerHTML = '<h1>🏙️ 市民大富翁</h1><div class="panel hl"><h2>房主已離開</h2>'+
      '<p style="margin:0">這一局結束了。你可以回到首頁，自己玩一局或開一個新房間。</p></div>'+
      '<button class="btn" id="closedHome">回到首頁</button>';
    document.getElementById('closedHome').onclick = leaveRoom;
  }

  function chooseNow(P, i){
    if(P.picked != null) return;
    if(isGuest()){
      var card = cardById(P.cardId);
      if(i < card.options.length && window.CityGame && typeof window.CityGame.onChoice === 'function'){
        try{ window.CityGame.onChoice({cardId:P.cardId, optionIndex:i, round:G.round}); }catch(e){}
      }
      CityNet.sendAction(NET.code, NET.me, 'choose', {idx:i, pid:P.id});
      G.prompt.picked = i; G.prompt.rev++; showPromptModal();   // 先在自己的畫面標起來，房主的更新很快會蓋過去
      return;
    }
    if(G.promptRes) G.promptRes(i);
  }
  function ackNow(P){
    if(isGuest()){ CityNet.sendAction(NET.code, NET.me, 'ack', {pid:P.id}); return; }
    if(G.promptRes) G.promptRes('ack');
  }
  function sendSuggest(i){ CityNet.suggest(NET.code, NET.me, i).catch(function(){}); }

  // 等朋友的操作（擲骰子或選選項）；朋友離線，或超過 75 秒沒動作，就由電腦代打（回傳 null）
  function waitRemote(pi, type, valid){
    return new Promise(function(resolve){
      var t0 = Date.now(), timer = null;
      function finish(v){ clearInterval(timer); NET.remoteWait = null; resolve(v); }
      NET.remoteWait = {seat:pi, type:type, valid:valid, resolve:finish};
      timer = setInterval(function(){
        if(CityNet.seatAway(pi) || Date.now() - t0 > 75000){ G.players[pi].auto = true; finish(null); }
      }, 1000);
    });
  }
  // 房主收到朋友送來的操作
  function onRemoteAction(a){
    if(!G || !G.players[a.seat]) return;
    G.players[a.seat].auto = false;                // 朋友回來操作了，就不再代打
    var w = NET.remoteWait;
    if(a.type === 'roll' && w && w.type === 'roll' && w.seat === a.seat){ w.resolve(a); return; }
    if(a.type === 'choose' && w && w.type === 'choose' && w.seat === a.seat){ if(!w.valid || w.valid(a)) w.resolve(a); return; }
    if(a.type === 'ack' && G.prompt && G.prompt.seat === a.seat && a.pid === G.prompt.id && G.promptRes) G.promptRes('ack');
  }

  function chooseOption(card, opts, p, tile, pi){
    G.lastReason = ''; G.autoPlayed = false;
    var P = {kind:'card', seat:pi, cardId:card.id, tileId:tile.id,
             opts: opts.map(function(o){ return {label:o.label, cost:o.cost, fx:o.fx}; }),
             budget:G.budget, picked:null, note:'', suggest:{}};
    if(isHost()) CityNet.clearSuggest(NET.code).catch(function(){});
    var ask = askPrompt(P, 0);
    if(p.bot){
      // 讓真人看得懂電腦做了什麼：先看完所有選項，再標出電腦的選擇和理由
      var choice = botChoose(opts);
      G.lastReason = choice.reason || '';
      sleep(1500).then(function(){
        updatePrompt({picked: choice.index, note: choice.reason ? '💭 '+p.name+'：'+choice.reason : ''});
        return sleep(2200);
      }).then(function(){ if(G.promptRes) G.promptRes(choice.index); });
    } else if(p.remote){
      waitRemote(pi, 'choose', function(a){ return opts[a.idx] && opts[a.idx].cost <= G.budget; }).then(function(a){
        var idx, note = '';
        if(a){ idx = a.idx; }
        else {                                       // 朋友離線或太久沒動作：電腦代打
          var ch = botChoose(opts);
          idx = ch.index; G.autoPlayed = true;
          G.lastReason = '電腦代打'+(ch.reason ? '：'+ch.reason : '');
          note = '💭 '+p.name+' 離線或太久沒動作，電腦代打';
        }
        updatePrompt({picked: idx, note: note});
        sleep(1000).then(function(){ if(G.promptRes) G.promptRes(idx); });
      });
    }
    return ask;
  }

  async function showResult(card, o, p, idx, pi){
    var P = {kind:'result', seat:pi, cardId:card.id, idx:idx, real: idx < card.options.length, title:card.title,
             who:p.name, label:o.label, text:o.result, cost:o.cost, fx:o.fx, reason:G.lastReason || ''};
    await askPrompt(P, holdMs(p, 4000, 6000));
    endPrompt();
  }

  // 結果視窗停多久自動繼續：單機時要真人按「繼續」（電腦的結果可以選自動）；
  // 連線時一律幾秒後自動繼續，不讓大家乾等（本人或房主可以提早按）
  function holdMs(p, localMs, netMs){ return NET.on ? netMs : (p.bot && !G.botWait ? localMs : 0); }

  /* ---------- 機會卡／一般提示 ---------- */
  async function playChance(p, tile){
    var card = draw(D.chances, G.usedChances, tile.id);
    var g = card.gain, budget = g.budget || 0, fx = {};
    IND.forEach(function(i){ if(g[i.k]) fx[i.k] = g[i.k]; });
    applyEffects(fx, budget);
    render();
    var chips = (budget ? costChip(-budget) : '') + fxChips(fx);
    addFeed(piOf(p), '<b>'+esc(p.name)+'</b>・'+esc(tile.name)+'：🎁 '+esc(card.title)+' <span class="chips" style="display:inline-flex">'+chips+'</span>');
    await info(p, '🎁 '+card.title, card.text, budget, fx);
  }

  async function info(p, title, text, gain, fx){
    await askPrompt({kind:'info', seat:piOf(p), title:title, text:text, gain:gain || 0, fx:fx || {}}, holdMs(p, 2500, 3500));
    endPrompt();
    checkLose();
  }

  /* ---------- 數值變動與勝負 ---------- */
  var clearTimer = null;
  function applyEffects(fx, budgetDelta){
    G.budget = Math.max(0, G.budget + budgetDelta);
    var d = {}, prevS = G.ind.s;
    IND.forEach(function(i){
      if(fx[i.k]){
        var before = G.ind[i.k];
        G.ind[i.k] = clamp(before + fx[i.k], 0, 100);
        d[i.k] = G.ind[i.k] - before;
      }
    });
    // 小海豚的里程碑：滿意度第一次升過 60、過關線、85 時，小海豚會開心跳幾下
    if(G.ind.s > prevS){
      [60, C.winSatisfaction, 85].forEach(function(m){
        if(prevS < m && G.ind.s >= m && !G.mile[m]){
          G.mile[m] = true;
          G.jumpUntil = Date.now() + 3000;
          addFeed(null, '🐬 小海豚好開心：市民滿意度突破 '+m+'！');
        }
      });
    }
    G.delta = d; G.deltaBudget = budgetDelta;
    clearTimeout(clearTimer);
    clearTimer = setTimeout(function(){ if(G){ G.delta = {}; G.deltaBudget = 0; render(); } }, 3000);
  }

  function checkLose(){
    if(G.over) return true;
    var z = IND.filter(function(i){ return G.ind[i.k] <= 0; })[0];
    if(z){ finish(false, z.icon+z.name+'降到 0，城市撐不住了。', z.k); return true; }
    return false;
  }

  async function endRound(){
    var inc = incomeNow(), dv = decayVec();
    var fx = {s:-dv.s, t:-dv.t, e:-dv.e, c:-dv.c};
    var season = G.season;
    applyEffects(fx, inc);
    addFeed(null, '⏳ 第 '+G.round+' 回合結束'+(season ? '（'+season.icon+esc(season.name)+'）' : '')+
      ' <span class="chips" style="display:inline-flex">'+costChip(-inc)+fxChips(fx)+'</span>');
    G.phase = 'idle'; G.msg = '第 '+G.round+' 回合結束'; render();
    if(checkLose()) return;
    var last = G.round >= C.rounds;
    await askPrompt({kind:'round', seat:-1, round:G.round, inc:inc, fx:fx, last:last,
                     season: season ? {icon:season.icon, name:season.name, text:season.text} : null},
                    NET.on ? 6000 : 0);        // 單機：按「下一回合」才繼續；連線：幾秒後自動繼續
    endPrompt();
    if(last){ evaluate(); return; }
    G.round++;
    nextSeason();                                    // 抽下一回合的時節
  }

  function evaluate(){
    var low = IND.filter(function(i){ return i.k!=='s' && G.ind[i.k] <= C.minOtherIndicator; })[0];
    if(G.ind.s < C.winSatisfaction){
      finish(false, '🙂市民滿意度只有 '+G.ind.s+'，沒有達到 '+C.winSatisfaction+'。', 's');
    } else if(low){
      finish(false, low.icon+low.name+'只剩 '+G.ind[low.k]+'，需要超過 '+C.minOtherIndicator+'。', low.k);
    } else {
      finish(true, '城市撐過了 '+C.rounds+' 回合，大家做得很好！', null);
    }
  }

  function weakest(){
    var w = IND[0];
    IND.forEach(function(i){ if(G.ind[i.k] < G.ind[w.k]) w = i; });
    return w;
  }

  function finish(win, reason, failKey){
    if(G.over) return;
    G.over = true;
    var w = failKey ? IND.filter(function(i){ return i.k===failKey; })[0] : weakest();
    var stars = rate(win);
    G.result = {win:win, reason:reason, weak:w, stars:stars, title:titleFor(win)};
    // 記錄這局的成績（只存在這個瀏覽器）
    G.prevBest = PROG.bestStars;
    PROG.plays++; if(win) PROG.wins++;
    if(stars > PROG.bestStars) PROG.bestStars = stars;
    saveProgress();
    closeModal();
    render();
    if(isHost()){                                   // 連線：通知朋友遊戲結束，讓大家都看到結算
      G.prompt = null;
      netPublish(true);
      CityNet.setStatus(NET.code, 'over').catch(function(){});
    }
    // 結算時再抓一次最新的比例，抓到了就重畫結算畫面
    if(window.CityStats && window.CityStats.enabled()){
      window.CityStats.load().then(function(){ if(G && G.over) render(); });
    }
  }

  /* =================== 連線（房主＝跑遊戲，朋友＝看畫面並送出操作）=================== */

  function netError(e){ NET.err = (e && e.message) ? e.message : String(e); render(); }

  // 房主：把目前的畫面發布到雲端（只送有變的部分，而且稍微合併，避免一秒送上百次）
  function netPublish(now){
    if(!isHost() || !G) return;
    clearTimeout(NET.pubT);
    NET.pubT = setTimeout(doPublish, now ? 0 : 90);
  }
  function doPublish(){
    if(!isHost() || !G) return;
    var core = JSON.stringify({
      players: G.players.map(function(p){ return {name:p.name, bot:!!p.bot, remote:!!p.remote, auto:!!p.auto, pos:p.pos}; }),
      turn:G.turn, round:G.round, budget:G.budget, ind:G.ind,
      season: G.season ? {id:G.season.id, name:G.season.name, icon:G.season.icon, text:G.season.text, mult:G.season.mult} : null,
      dice:G.dice, phase:G.phase, msg:G.msg, delta:G.delta, deltaBudget:G.deltaBudget, jump: Date.now() < G.jumpUntil,
      over:G.over, result: G.over ? G.result : null, log: G.over ? G.log : null
    });
    var feed = JSON.stringify(G.feed), prompt = JSON.stringify(G.prompt || null), parts = {};
    if(core !== NET.last.core) parts.core = core;
    if(feed !== NET.last.feed) parts.feed = feed;
    if(prompt !== NET.last.prompt) parts.prompt = prompt;
    if(!Object.keys(parts).length) return;
    NET.last.core = core; NET.last.feed = feed; NET.last.prompt = prompt;
    CityNet.publish(NET.code, parts).catch(netError);
  }

  // 房主：存檔，重新整理後可以從這個回合接回來
  function saveGame(){
    if(!isHost() || !G) return;
    var s = {players:G.players, turn:G.turn, round:G.round, budget:G.budget, ind:G.ind, usedEvents:G.usedEvents,
             usedChances:G.usedChances, log:G.log, seasonDeck:G.seasonDeck, season:G.season, feed:G.feed, mile:G.mile,
             level:G.level, botWait:G.botWait};
    CityNet.saveState(NET.code, JSON.stringify(s)).catch(function(){});
  }
  function restoreGame(s){
    s.players.forEach(function(p){ p.auto = false; });
    G = {players:s.players, turn:s.turn, round:s.round, budget:s.budget, ind:s.ind, usedEvents:s.usedEvents || {},
         usedChances:s.usedChances || {}, log:s.log || [], dice:0, phase:'idle', msg:'', delta:{}, deltaBudget:0, over:false,
         result:null, rollResolve:null, level:s.level || 'normal', seasonDeck:s.seasonDeck || [], season:s.season || null,
         botWait:s.botWait, lastReason:'', feed:s.feed || [], mile:s.mile || {}, jumpUntil:0, newCards:[], newSeasons:[],
         prompt:null, promptRes:null, promptTimer:null};
  }

  // 朋友：收到房主發布的畫面，換成這份畫面並重畫（包含彈出視窗）
  function applyView(v){
    if(NET.closed || !v || !v.core) return;
    var core = JSON.parse(v.core);
    var feed = v.feed ? JSON.parse(v.feed) : [];
    var prompt = v.prompt ? JSON.parse(v.prompt) : null;
    var keep = G || {};
    G = {players:core.players, turn:core.turn, round:core.round, budget:core.budget, ind:core.ind, season:core.season,
         dice:core.dice, phase:core.phase, msg:core.msg, delta:core.delta || {}, deltaBudget:core.deltaBudget || 0,
         jumpUntil: core.jump ? Date.now() + 3000 : 0, over:!!core.over, result:core.result, log:core.log || [],
         feed:feed, prompt:prompt, newCards:keep.newCards || [], newSeasons:keep.newSeasons || [], prevBest:NET.prevBest,
         rollResolve:null, promptRes:null};
    if(core.season) markSeen('seasonsSeen', core.season.id);          // 朋友的圖鑑也會跟著解鎖
    if(prompt && prompt.kind === 'card') markSeen('seen', prompt.cardId);
    if(G.over && !NET.counted){
      NET.counted = true;
      PROG.plays++; if(G.result.win) PROG.wins++;
      if(G.result.stars > PROG.bestStars) PROG.bestStars = G.result.stars;
      saveProgress();
    }
    render();
    if(G.over){ closeModal(); NET.shownKey = ''; }
    else if((prompt ? prompt.id+':'+prompt.rev : '') !== NET.shownKey){ showPromptModal(); }
  }

  // 房主：朋友對選項的建議變了，更新到事件卡上
  function onSuggestUpdate(map){
    if(!G || !G.prompt || G.prompt.kind !== 'card' || G.prompt.picked != null) return;
    if(JSON.stringify(map) === JSON.stringify(G.prompt.suggest || {})) return;
    updatePrompt({suggest: map});
  }

  function onRoomUpdate(info){
    NET.meta = info.meta; NET.seats = info.seats;
    if(isGuest() && info.meta.status === 'closed' && !(G && G.over)){   // 房主離開了：這局結束
      NET.closed = true; EXITING = false; closeModal(); render(); return;
    }
    if(NET.on && (!G || (isGuest() && info.meta.status === 'lobby'))) render();
  }

  function roomUrl(code){
    var q = new URLSearchParams(location.search); q.set('room', code);
    return location.pathname + '?' + q.toString();
  }
  // 要傳給朋友的連結：保留 mode=test，但拿掉測試用的 tab 參數
  function inviteLink(code){
    var q = new URLSearchParams(location.search); q.delete('tab'); q.set('room', code);
    return location.origin + location.pathname + '?' + q.toString();
  }
  function baseUrl(){
    var q = new URLSearchParams(location.search); q.delete('room');
    var s = q.toString();
    return location.pathname + (s ? '?' + s : '');
  }
  function nickOf(def){ var n = (SETUP.nick || '').trim().slice(0, 8); return n || def; }

  function enterRoom(code, role, seat){
    NET.on = true; NET.role = role; NET.code = code; NET.me = seat; NET.claimed = role === 'host' || seat >= 0; NET.err = '';
    NET.prevBest = PROG.bestStars;
    CityNet.saveSession({code:code, role:role, seat:seat});
    CityNet.watchRoom(code, onRoomUpdate);
    if(role === 'host'){
      CityNet.watchActions(code, onRemoteAction);
      CityNet.watchSuggest(code, onSuggestUpdate);
    } else {
      CityNet.watchView(code, applyView);
      CityNet.startHeartbeat(code, seat);
    }
    try{ history.replaceState(null, '', roomUrl(code)); }catch(e){}
    render();
  }

  // 房主開房間：上面選「真人」的位子留給朋友，選「電腦」的由電腦補上
  async function openRoom(){
    if(NET.busy) return;
    NET.busy = true; NET.err = ''; renderSetup();
    try{
      SETUP.seats[0] = 'human';
      var seats = [], botNo = 0;
      for(var i = 0; i < SETUP.n; i++){
        if(i === 0) seats.push({type:'host', name:nickOf('')});
        else if(SETUP.seats[i] === 'bot') seats.push({type:'bot', name:'電腦'+String.fromCharCode(65 + botNo++)});
        else seats.push({type:'open', name:''});
      }
      var code = await CityNet.createRoom({n:SETUP.n, level:SETUP.level, mode: window.CityStats ? window.CityStats.mode : 'test', seats:seats});
      NET.busy = false;
      enterRoom(code, 'host', 0);
    }catch(e){
      NET.busy = false; NET.err = e.message || String(e); renderSetup();
    }
  }

  // 房主按「開始遊戲」：沒人坐的位子改成電腦，然後開始
  async function startNetGame(){
    var meta = NET.meta, seats = NET.seats || {}, players = [], botNo = 0, ops = [];
    for(var i = 0; i < meta.n; i++){
      var s = seats[i] || {type:'open'};
      if(s.type === 'host') players.push({name:s.name || '玩家1', bot:false, remote:false, pos:0});
      else if(s.type === 'human') players.push({name:s.name || '玩家'+(i+1), bot:false, remote:true, pos:0});
      else {
        var nm = s.type === 'bot' && s.name ? s.name : '電腦'+String.fromCharCode(65 + botNo);
        botNo++;
        players.push({name:nm, bot:true, remote:false, pos:0});
        if(s.type === 'open') ops.push(CityNet.setSeat(NET.code, i, {type:'bot', name:nm}));
      }
    }
    try{ await Promise.all(ops); }catch(e){ return netError(e); }
    SETUP.level = meta.level || SETUP.level;
    SETUP.botWait = false;
    newGame(players);
    try{ await CityNet.setStatus(NET.code, 'playing'); }catch(e){ return netError(e); }
    netPublish(true);
    gameLoop(0);
  }

  // 朋友挑一個空位坐下
  async function joinSeat(){
    var input = document.getElementById('nick');
    var name = input ? input.value.trim().slice(0, 8) : '';
    if(NET.busy) return;
    NET.busy = true; NET.err = ''; render();
    try{
      var i = await CityNet.claimSeat(NET.code, name);
      NET.busy = false;
      enterRoomAfterClaim(i);
    }catch(e){
      NET.busy = false; NET.err = e.message || String(e); render();
    }
  }
  function enterRoomAfterClaim(seat){
    NET.me = seat; NET.claimed = true; NET.role = 'guest'; NET.err = '';
    NET.prevBest = PROG.bestStars;
    CityNet.saveSession({code:NET.code, role:'guest', seat:seat});
    CityNet.watchView(NET.code, applyView);
    CityNet.startHeartbeat(NET.code, seat);
    render();
  }

  // 網址有 ?room=代碼：連線進房間。是房主就接回遊戲；之前坐過的位子就接回；否則顯示加入畫面
  async function boot(){
    var code = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
    if(!code || !window.CityNet || !CityNet.available()){ render(); return; }
    NET.on = true; NET.code = code; NET.role = 'guest'; NET.me = -1; NET.claimed = false; render();
    try{
      await CityNet.init();
      var info = await CityNet.peek(code);
      if(!info){ NET.on = false; NET.err = '找不到房間 '+code+'，請跟朋友確認代碼'; history.replaceState(null, '', baseUrl()); render(); return; }
      NET.meta = info.meta; NET.seats = info.seats; NET.prevBest = PROG.bestStars;
      var uid = CityNet.uid();
      if(info.meta.hostUid === uid){ await resumeHost(code, info); return; }
      for(var i = 0; i < info.meta.n; i++){
        var s = info.seats[i];
        if(s && s.type === 'human' && s.uid === uid){ enterRoom(code, 'guest', i); return; }
      }
      CityNet.watchRoom(code, onRoomUpdate);     // 還沒坐下：先看大廳
      render();
    }catch(e){
      NET.on = false; NET.err = e.message || String(e); render();
    }
  }
  async function resumeHost(code, info){
    NET.role = 'host'; NET.me = 0; NET.claimed = true;
    CityNet.saveSession({code:code, role:'host', seat:0});
    CityNet.watchRoom(code, onRoomUpdate);
    CityNet.watchActions(code, onRemoteAction);
    CityNet.watchSuggest(code, onSuggestUpdate);
    if(info.meta.status === 'playing'){
      var saved = await CityNet.loadState(code);
      if(saved){
        restoreGame(JSON.parse(saved));
        gameLoop(G.turn);                          // 從存檔的那一回合接著玩
        return;
      }
    }
    render();
  }

  function copyText(text, btn){
    function done(){ if(btn){ var old = btn.textContent; btn.textContent = '已複製 ✓'; setTimeout(function(){ btn.textContent = old; }, 1500); } }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, function(){ window.prompt('請複製這個連結：', text); }); }
    else { window.prompt('請複製這個連結：', text); }
  }

  /* ---------- 畫面：連線大廳 ---------- */
  function renderLobby(){
    if(!NET.meta){
      app.innerHTML = '<h1>🏙️ 市民大富翁</h1><div class="panel"><p style="margin:0">'+
        (NET.err ? '<span class="err">'+esc(NET.err)+'</span>' : '連線中…')+'</p></div>';
      return;
    }
    var meta = NET.meta, seats = NET.seats || {}, code = NET.code, rows = '';
    for(var i = 0; i < meta.n; i++){
      var s = seats[i] || {type:'open'}, label = '', extra = '';
      if(s.type === 'host') label = '房主'+(s.name ? '：'+esc(s.name) : '')+(isHost() ? '（你）' : '');
      else if(s.type === 'human') label = '朋友：'+esc(s.name || '玩家'+(i+1))+(i === NET.me ? '（你）' : '')+(CityNet.seatAway(i) ? '<span class="badge">離線</span>' : '');
      else if(s.type === 'bot') label = '電腦補位';
      else {
        label = '⏳ 等朋友加入…';
        if(isHost()) extra = '<button class="btn ghost" data-bot="'+i+'">改成電腦</button>';
      }
      rows += '<div class="seatrow">'+tokenHtml(i)+'<div class="nm2">'+label+'</div>'+extra+'</div>';
    }
    var openLeft = Object.keys(seats).some(function(k){ return seats[k] && seats[k].type === 'open'; });
    var body = '';
    if(isHost()){
      var link = inviteLink(code);
      body = '<div class="panel hl"><h2>把這個連結傳給朋友</h2>'+
        '<div class="roomcode">'+esc(code)+'</div>'+
        '<div class="hint" style="text-align:center;margin-bottom:8px">（朋友也可以在首頁輸入這組房間代碼）</div>'+
        '<div class="row"><input type="text" readonly value="'+esc(link)+'" id="linkBox">'+
        '<button class="btn" id="copyBtn">複製連結</button></div>'+
        (navigator.share ? '<div style="margin-top:8px"><button class="btn ghost" id="shareBtn">用 LINE 或其他 App 分享</button></div>' : '')+
        '</div>'+
        '<div class="panel"><h2>座位</h2>'+rows+
        (openLeft ? '<p class="hint" style="margin:8px 0 0">開始時還沒人坐的位子，會由電腦補上。</p>' : '')+'</div>'+
        '<button class="btn" id="startNet">開始遊戲</button>';
    } else if(!NET.claimed){
      body = '<div class="panel hl"><h2>你被邀請加入一局市民大富翁</h2>'+
        '<p style="margin:0 0 8px">房間代碼：<b>'+esc(code)+'</b></p>'+
        (meta.status !== 'lobby' ? '<p class="err">這個房間已經開始遊戲了，下次早點加入吧！</p>' :
         '<div class="row"><input type="text" id="nick" maxlength="8" placeholder="你的暱稱（可留空）">'+
         '<button class="btn" id="joinSeat"'+(NET.busy ? ' disabled' : '')+'>加入</button></div>')+
        '</div><div class="panel"><h2>座位</h2>'+rows+'</div>';
    } else {
      body = '<div class="panel hl"><h2>你已經加入了 🎉</h2><p style="margin:0">等房主按下「開始遊戲」，畫面就會自動出現。</p></div>'+
        '<div class="panel"><h2>座位</h2>'+rows+'</div>';
    }
    app.innerHTML = '<h1>🏙️ 市民大富翁</h1><p class="sub">找朋友一起玩：大家同一隊，各用自己的手機。</p>'+body+
      (NET.err ? '<div class="err">'+esc(NET.err)+'</div>' : '')+
      '<div style="margin-top:12px"><button class="btn ghost" id="leaveBtn">離開房間</button></div>'+
      '<p class="foot">連線時，暱稱和座位會暫存在雲端，只用來讓大家看到彼此；不需要註冊，也不會記錄你的真實身分。</p>';

    var q = function(id){ return document.getElementById(id); };
    if(q('copyBtn')) q('copyBtn').onclick = function(){ copyText(inviteLink(code), q('copyBtn')); };
    if(q('shareBtn')) q('shareBtn').onclick = function(){ navigator.share({title:'市民大富翁', text:'一起來玩市民大富翁！', url:inviteLink(code)}).catch(function(){}); };
    if(q('startNet')) q('startNet').onclick = startNetGame;
    if(q('joinSeat')) q('joinSeat').onclick = joinSeat;
    if(q('leaveBtn')) q('leaveBtn').onclick = leaveRoom;
    app.querySelectorAll('[data-bot]').forEach(function(b){
      b.onclick = function(){ CityNet.setSeat(NET.code, +b.dataset.bot, {type:'bot', name:'電腦'+String.fromCharCode(65 + (+b.dataset.bot))}).catch(netError); };
    });
  }
  async function leaveRoom(){
    if(isHost() && !(G && G.over)){          // 房主在大廳離開：通知還在等的朋友
      try{ await Promise.race([CityNet.setStatus(NET.code, 'closed'), sleep(1500)]); }catch(e){}
    }
    try{ CityNet.leave(); CityNet.clearSession(); }catch(e){}
    location.href = baseUrl();
  }

  /* ---------- 彈出視窗工具 ---------- */
  function modal(html, animKey){
    closeModal();
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="sheet"'+(animKey ? animAttr(animKey+'|s', 260) : '')+'>'+html+'</div>';
    if(animKey){
      var m = /animation-delay:(-?\d+ms)/.exec(animAttr(animKey+'|o', 200));
      if(m){ ov.setAttribute('data-a', ''); ov.style.animationDelay = m[1]; }
    }
    document.body.appendChild(ov);
    return ov;
  }
  function closeModal(){
    document.querySelectorAll('.overlay').forEach(function(e){ e.remove(); });
  }
  function waitClick(ov, sel, autoMs){
    return new Promise(function(resolve){
      var done = false;
      function fin(){ if(done) return; done = true; resolve(); }
      var btn = ov.querySelector(sel);
      if(btn) btn.addEventListener('click', fin);
      if(autoMs) setTimeout(fin, autoMs);
    });
  }

  /* ---------- 畫面：遊戲中 ---------- */
  function tilePos(id){
    if(id<=6) return {r:1, c:id};
    if(id<=10) return {r:id-5, c:6};
    if(id<=16) return {r:6, c:6-(id-11)};
    return {r:6-(id-16), c:1};
  }

  function renderGame(){
    var p = cur();
    var playersHtml = G.players.map(function(pl,i){
      var badge = pl.bot ? '<span class="badge">電腦</span>' :
                  pl.auto ? '<span class="badge">電腦代打中</span>' :
                  (NET.on && i === NET.me) ? '<span class="badge">你</span>' : '';
      return '<span class="pl'+(i===G.turn && !G.over ? ' now':'')+'">'+tokenHtml(i)+esc(pl.name)+badge+'</span>';
    }).join('');

    var indHtml = IND.map(function(i){
      var v = G.ind[i.k], thr = i.k==='s' ? C.winSatisfaction : C.minOtherIndicator;
      var d = G.delta[i.k];
      return '<div class="ind"><span>'+i.icon+' '+i.name+'</span>'+
        (i.k==='s' ? dolphinTrack(v, Date.now() < G.jumpUntil)
                   : '<div class="bar"><i style="width:'+v+'%;background:var(--'+i.k+')"></i><u style="left:'+thr+'%"></u></div>')+
        '<b>'+v+(d ? '<span class="delta '+(d>0?'pos':'neg')+'">'+(d>0?'+':'')+d+'</span>' : '')+'</b></div>';
    }).join('');

    var seasonHtml = '';
    if(G.season){
      var dv = decayVec();
      seasonHtml = '<div class="season"><b>'+G.season.icon+' 本回合時節：'+esc(G.season.name)+'</b>'+
        '<span>'+esc(G.season.text)+'</span>'+
        '<span>回合結束時：'+IND.map(function(i){ return i.icon+'−'+dv[i.k]; }).join('　')+'</span></div>';
    }
    var tilesHtml = D.tiles.map(function(t){
      var pos = tilePos(t.id);
      var isHere = G.players.some(function(pl){ return pl.pos===t.id-1; }) && G.players[G.turn].pos===t.id-1;
      var bonus = t.bonus ? IND.filter(function(i){ return i.k===t.bonus; })[0].icon : '';
      var deco = DECO[t.id] ? '<svg class="deco" viewBox="0 0 40 40" aria-hidden="true"><use href="#d-'+DECO[t.id]+'"/></svg>' : '';
      return '<div class="tile '+t.type+(isHere?' here':'')+'" data-id="'+t.id+'" style="grid-row:'+pos.r+';grid-column:'+pos.c+'">'+
        '<div class="top"><span>'+t.id+'</span><span>'+TYPE_ICON[t.type]+bonus+'</span></div>'+
        '<div class="dz">'+deco+'</div>'+
        '<div class="nm">'+esc(t.name)+'</div></div>';
    }).join('');
    var trees = [1,2,3,4].map(function(n){ return '<svg class="deco c'+n+'" viewBox="0 0 40 40" aria-hidden="true"><use href="#d-tree"/></svg>'; }).join('');

    var feedHtml = G.feed.length ?
      '<div class="panel" style="margin-top:12px"><h2>動態紀錄</h2><ul class="feed">'+G.feed.map(function(f){
        return '<li>'+(f.pi != null ? tokenHtml(f.pi)+' ' : '')+f.html+'</li>';
      }).join('')+'</ul></div>' : '';

    var action;
    if(G.phase==='roll' && isMine(p)){
      action = '<button class="btn" id="rollBtn">🎲 擲骰子</button>';
    } else {
      action = '<div class="hint">'+esc(G.msg)+'</div>';
    }

    app.innerHTML =
      '<div class="hud"><span>第 '+G.round+' / '+C.rounds+' 回合</span>'+
      '<span class="budget">💰 預算 '+G.budget+(G.deltaBudget ? '<span class="delta '+(G.deltaBudget>0?'pos':'neg')+'">'+(G.deltaBudget>0?'+':'')+G.deltaBudget+'</span>' : '')+'</span></div>'+
      '<div class="players">'+playersHtml+'</div>'+
      seasonHtml+
      '<div class="inds">'+indHtml+'</div>'+
      '<div class="stage"><div class="board">'+tilesHtml+
        '<div class="center">'+trees+'<div class="who">'+tokenHtml(G.turn)+esc(p.name)+'</div>'+
        '<div class="dice"'+(G.dice ? animAttr('dice|'+G.round+'|'+G.turn+'|'+G.dice, 350, 0, '--rot:'+(((G.dice*47+G.turn*13) % 61) - 30)+'deg') : '')+'>'+DICE[G.dice||0]+'</div>'+action+'</div></div></div>'+
      '<div class="row" style="margin:-6px 0 10px"><span class="hint" style="min-height:0">視角</span>'+
        '<span class="seg"><button data-view="3d" class="'+(VIEW_FLAT?'':'on')+'">立體</button><button data-view="flat" class="'+(VIEW_FLAT?'on':'')+'">平面</button></span>'+
        '<button class="btn ghost" id="exitBtn" style="margin-left:auto">🚪 離開遊戲</button></div>'+
      feedHtml+
      '<p class="foot">小海豚走到🚩就是過關線（'+C.winSatisfaction+'）；其他三項的黑色小線是 '+C.minOtherIndicator+'，要超過它。</p>';

    app.querySelectorAll('[data-view]').forEach(function(b){
      b.onclick = function(){ setView(b.dataset.view === 'flat'); };
    });
    syncPieces(app.querySelector('.board'));
    var eb = document.getElementById('exitBtn');
    if(eb) eb.onclick = confirmExit;
    var rb = document.getElementById('rollBtn');
    if(rb) rb.onclick = function(){
      if(isGuest()){ CityNet.sendAction(NET.code, NET.me, 'roll'); rb.disabled = true; return; }   // 朋友：請房主幫忙擲
      if(G.rollResolve){ var r = G.rollResolve; G.rollResolve = null; r(); }
    };
  }

  /* ---------- 畫面：結算 ---------- */
  function renderResult(){
    detachPieces();
    var R = G.result;
    var indHtml = IND.map(function(i){
      return '<div class="ind"><span>'+i.icon+' '+i.name+'</span>'+
        (i.k==='s' ? dolphinTrack(G.ind.s, false)
                   : '<div class="bar"><i style="width:'+G.ind[i.k]+'%;background:var(--'+i.k+')"></i></div>')+
        '<b>'+G.ind[i.k]+'</b></div>';
    }).join('');
    var newBest = R.stars > 0 && R.stars > G.prevBest;
    var ratingHtml = '<div class="panel hl" style="text-align:center">'+
      '<div class="bigDolphin">'+dolphinSvg(moodOf(G.ind.s))+'</div>'+
      starsHtml(R.stars, 'star')+
      '<h2 class="fadeup"'+animAttr('title', 400, 250+300*R.stars, 'margin:6px 0 2px')+'>稱號：'+esc(R.title.name)+'</h2>'+
      '<p class="fadeup"'+animAttr('titleText', 400, 400+300*R.stars, 'margin:0 0 8px')+'>'+esc(R.title.text)+'</p>'+
      (newBest ? '<p class="win" style="margin:0 0 8px"><b>🏅 這是你的新紀錄！</b></p>' : '')+
      '<p class="hint" style="margin:0">'+esc(nextStarHint(R.stars))+'</p></div>';
    var collectHtml = '<div class="panel"><h2>📚 市政圖鑑</h2>'+
      '<p style="margin:0 0 6px">這局新解鎖 '+G.newCards.length+' 張事件卡、'+G.newSeasons.length+' 個時節。</p>'+
      '<p class="hint" style="margin:0">累計：事件卡 '+seenCount('seen', D.events)+'／'+D.events.length+'，時節 '+
      seenCount('seasonsSeen', D.seasons)+'／'+D.seasons.length+'；玩過 '+PROG.plays+' 局，過關 '+PROG.wins+' 次，最佳 '+starsHtml(PROG.bestStars)+
      '。（只存在這個瀏覽器裡，不會上傳）</p></div>';
    var statsHtml = '';
    if(window.CityStats){
      // 只看「自己」選的：單機是所有真人，連線是自己的座位
      var mine = G.log.filter(function(l){
        return (NET.on ? l.seat === NET.me : !l.bot) && !l.auto && l.real && window.CityStats.share(l.cardId, l.idx);
      });
      if(mine.length){
        statsHtml = '<div class="panel"><h2>你和大家的想法</h2><ul class="log">'+mine.map(function(l){
          var s = window.CityStats.share(l.cardId, l.idx);
          return '<li>'+esc(l.title)+'：你選「'+esc(l.choice)+'」，'+s.pct+'% 的玩家跟你一樣</li>';
        }).join('')+'</ul><div class="hint">這是玩家選擇統計，不是民意調查。</div></div>';
      }
    }
    var logHtml = G.log.length ? '<ol class="log">'+G.log.map(function(l){
      return '<li>第 '+l.round+' 回合・'+esc(l.tile)+'：'+esc(l.title)+' → '+esc(l.choice)+'（'+esc(l.who)+(l.auto ? '・電腦代打' : '')+'）</li>';
    }).join('')+'</ol>' : '<p class="hint">這局沒有處理任何事件。</p>';

    app.innerHTML =
      '<p class="big '+(R.win?'win':'lose')+'">'+(R.win ? '🎉 全隊獲勝！' : '😢 這次沒撐住')+'</p>'+
      '<p>'+esc(R.reason)+'</p>'+
      ratingHtml+
      '<div class="panel"><h2>最後的城市</h2><div class="inds">'+indHtml+'</div>'+
        '<div class="hint">💰 剩下預算 '+G.budget+'</div></div>'+
      collectHtml+
      '<div class="panel"><h2>想一想</h2><p>最弱的是「'+R.weak.icon+R.weak.name+'」。'+REFLECT[R.weak.k]+'</p></div>'+
      statsHtml+
      '<div class="panel"><h2>這局做過的決定</h2>'+logHtml+'</div>'+
      '<button class="btn" id="againBtn">再玩一局</button>'+
      '<p class="foot">這是公民教育遊戲，事件內容為情境模擬，不代表任何政黨或個人的立場。</p>';
    document.getElementById('againBtn').onclick = function(){
      if(NET.on){ leaveRoom(); } else { location.reload(); }   // 連線的局結束後，回到首頁重新開（或重新開房間）
    };
  }

  function render(){
    applyTone(!G ? 1 : G.over ? 4 : (G.round || 1));   // 開始前＝清晨、結算＝白天、遊戲中跟著回合
    if(NET.closed){ detachPieces(); return renderClosed(); }
    if(NET.on && !G) return renderLobby();
    if(!G) return renderSetup();
    if(G.over) return renderResult();
    renderGame();
  }

  boot();
})();
</script>
</body>
</html>
